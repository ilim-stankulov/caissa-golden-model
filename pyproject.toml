[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caissa-golden-model"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["model"]